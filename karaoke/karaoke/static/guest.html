<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0718">
  <title>Karaoké</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: rgba(12, 7, 24, 0.82); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    header .brand { font-size: 1.45rem; }
    header .room { margin-left: auto; font-size: 0.85rem; }
    header .me {
      padding: 0.35em 0.8em; border-radius: 999px; background: var(--surface-2);
      font-weight: 600; font-size: 0.9rem; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    main { padding: 16px; max-width: 640px; margin: 0 auto; }
    .view { display: none; }
    .view.active { display: block; animation: fade 0.2s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

    /* now-playing mini card */
    .now { display: flex; gap: 12px; align-items: center; padding: 12px; margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(255, 61, 139, 0.18), rgba(123, 92, 255, 0.18)); }
    .now img { width: 64px; aspect-ratio: 1; object-fit: cover; border-radius: 12px; flex: none; }
    .now .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .now .t { font-weight: 700; }
    .now .meta { min-width: 0; flex: 1; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* search */
    .searchbar { position: relative; margin-bottom: 14px; }
    .searchbar .field { padding-left: 2.8em; font-size: 1.05rem; }
    .searchbar .icon { position: absolute; left: 1em; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .scope { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 2px 12px; font-size: 0.85rem; }
    .scope button { color: var(--pink); font-weight: 600; font-size: 0.85rem; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .song { display: flex; gap: 12px; align-items: center; padding: 10px; }
    .song img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; flex: none; background: var(--surface-2); }
    .song .meta { min-width: 0; flex: 1; }
    .song .t { font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .song .a { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
    .song .tags { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
    .add {
      width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
      background: var(--grad); color: white; font-size: 1.5rem; font-weight: 400; line-height: 1;
      box-shadow: 0 4px 16px rgba(255, 61, 139, 0.35); transition: transform 0.15s;
    }
    .add:active { transform: scale(0.88); }
    .add.done { background: var(--green); box-shadow: none; font-size: 1.1rem; }

    .placeholder { text-align: center; padding: 48px 16px; color: var(--muted); }
    .placeholder .big { font-size: 2.6rem; margin-bottom: 8px; }
    .skeleton { height: 74px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .more { margin-top: 18px; text-align: center; }

    /* queue */
    .qhead { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
    .qhead h2 { margin: 0; font-size: 1.1rem; }
    .qi { display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 4px; touch-action: pan-y; }
    .qi.mine { border-color: rgba(255, 61, 139, 0.45); }
    .qi .handle { padding: 8px 6px; color: var(--muted); cursor: grab; touch-action: none; font-size: 1.1rem; }
    .qi .pos { width: 1.6em; text-align: center; font-weight: 800; color: var(--muted); flex: none; }
    .qi img { width: 72px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex: none; }
    .qi .meta { min-width: 0; flex: 1; }
    .qi .t { font-weight: 600; }
    .qi .sub { font-size: 0.85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
    .qi .x { width: 36px; height: 36px; border-radius: 50%; color: var(--muted); font-size: 1.2rem; flex: none; }
    .qi .x:active { background: var(--surface-2); }
    .bar { height: 3px; background: var(--surface-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--grad); transition: width 0.4s; }
    .sortable-ghost { opacity: 0.35; }
    .sortable-chosen { box-shadow: var(--shadow); transform: scale(1.02); }

    /* stage / controls */
    .stage { text-align: center; padding-top: 8px; }
    .stage .art { width: min(80vw, 340px); aspect-ratio: 16/9; object-fit: cover; border-radius: 20px; margin: 0 auto 20px; box-shadow: var(--shadow); }
    .stage .t { font-size: 1.5rem; font-weight: 800; }
    .stage .a { color: var(--muted); margin-top: 4px; }
    .stage .singer { margin-top: 12px; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 28px 0; }
    .ctl { width: 58px; height: 58px; border-radius: 50%; background: var(--surface-2); font-size: 1.3rem; display: grid; place-items: center; }
    .ctl.main { width: 78px; height: 78px; background: var(--grad); font-size: 1.8rem; box-shadow: 0 8px 28px rgba(255, 61, 139, 0.4); }
    .ctl:active { transform: scale(0.92); }
    .vol { display: flex; align-items: center; gap: 12px; max-width: 360px; margin: 0 auto; color: var(--muted); }
    input[type=range] { flex: 1; accent-color: var(--pink); height: 28px; }
    .stats { margin-top: 28px; font-size: 0.9rem; }

    /* tab bar */
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(12, 7, 24, 0.9); backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
    }
    nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; color: var(--muted); font-size: 0.75rem; font-weight: 600; position: relative; white-space: nowrap; }
    nav button .ic { font-size: 1.35rem; filter: grayscale(1); opacity: 0.7; }
    nav button.active { color: var(--text); }
    nav button.active .ic { filter: none; opacity: 1; }
    nav .badge { position: absolute; top: 2px; left: 55%; background: var(--pink); color: white; font-size: 0.7rem; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }

    /* name sheet + confirm dialog */
    .sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    .sheet .card { width: 100%; max-width: 520px; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; animation: up 0.25s ease; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet h2 { margin: 0 0 6px; }
    .sheet p { margin: 0 0 16px; }
    .sheet .actions { display: flex; gap: 10px; margin-top: 14px; }
    .sheet .actions .btn { flex: 1; }

    #offline { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: var(--red); color: white; text-align: center; padding: calc(4px + env(safe-area-inset-top)) 0 4px; font-size: 0.85rem; font-weight: 600; }
    body.offline #offline { display: block; }
  </style>
</head>
<body>
  <div id="offline">Connexion perdue… reconnexion</div>
  <header>
    <span class="brand">Karaoké</span>
    <span class="room muted">salle <span class="code" id="room-code"></span></span>
    <button class="me" id="me-btn">🎤 <span id="me-name"></span></button>
  </header>

  <main>
    <!-- SEARCH -->
    <section class="view active" id="view-search">
      <div class="now card hidden" id="now-mini"></div>
      <form class="searchbar" id="search-form">
        <span class="icon">🔍</span>
        <input class="field" id="q" type="search" placeholder="Titre ou artiste…" autocomplete="off" enterkeyhint="search">
      </form>
      <div class="scope muted" id="scope"></div>
      <div class="list" id="results"></div>
    </section>

    <!-- QUEUE -->
    <section class="view" id="view-queue">
      <div class="now card hidden" id="now-mini-q"></div>
      <div class="qhead"><h2>File d'attente</h2><span class="muted" id="qcount"></span></div>
      <div class="list" id="queue"></div>
      <p class="muted" style="font-size:.85rem;text-align:center;margin-top:16px" id="qhint">Maintiens ⠿ et glisse pour réordonner.</p>
    </section>

    <!-- STAGE -->
    <section class="view" id="view-stage">
      <div class="stage" id="stage"></div>
    </section>
  </main>

  <nav>
    <button data-view="search" class="active"><span class="ic">🔍</span>Chercher</button>
    <button data-view="queue"><span class="ic">🎶</span>File d'attente<span class="badge hidden" id="badge"></span></button>
    <button data-view="stage"><span class="ic">🎛️</span>Scène</button>
  </nav>

  <div class="sheet hidden" id="name-sheet">
    <form class="card" id="name-form">
      <h2>Salut ! 👋</h2>
      <p class="muted">Ton prénom s'affichera à l'écran quand ce sera ton tour.</p>
      <input class="field" id="name-input" maxlength="40" placeholder="Ton prénom" autocomplete="given-name" required>
      <div class="actions"><button class="btn btn-primary" type="submit">C'est parti</button></div>
    </form>
  </div>

  <div class="sheet hidden" id="confirm-sheet">
    <div class="card">
      <h2 id="confirm-title"></h2>
      <p class="muted" id="confirm-text"></p>
      <div class="actions">
        <button class="btn btn-ghost" id="confirm-no">Annuler</button>
        <button class="btn btn-primary" id="confirm-yes">Oui</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="/static/common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let room = null;
  let me = localStorage.getItem("karaoke.name") || "";
  let everywhere = false;
  let lastQuery = "";
  let results = [];
  let dragging = false;
  const added = new Set();

  $("room-code").textContent = ROOM_CODE;
  const sock = connectRoom("guest", (r) => { room = r; render(); });

  // --- name ---------------------------------------------------------------
  function showName() { $("me-name").textContent = me || "?"; }
  function askName() {
    $("name-input").value = me;
    $("name-sheet").classList.remove("hidden");
    setTimeout(() => $("name-input").focus(), 50);
  }
  $("name-form").onsubmit = (e) => {
    e.preventDefault();
    me = $("name-input").value.trim().slice(0, 40);
    if (!me) return;
    localStorage.setItem("karaoke.name", me);
    $("name-sheet").classList.add("hidden");
    showName();
    render();
  };
  $("me-btn").onclick = askName;
  showName();
  if (!me) askName();

  // --- tabs ---------------------------------------------------------------
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => show(b.dataset.view));
  function show(view) {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === `view-${view}`));
    window.scrollTo({ top: 0 });
  }

  // --- helpers ------------------------------------------------------------
  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function confirmSheet(title, text, yes = "Oui") {
    return new Promise((resolve) => {
      $("confirm-title").textContent = title;
      $("confirm-text").textContent = text;
      $("confirm-yes").textContent = yes;
      $("confirm-sheet").classList.remove("hidden");
      const done = (v) => { $("confirm-sheet").classList.add("hidden"); resolve(v); };
      $("confirm-yes").onclick = () => done(true);
      $("confirm-no").onclick = () => done(false);
    });
  }
  const fmt = (s) => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "";

  // --- search -------------------------------------------------------------
  $("search-form").onsubmit = (e) => {
    e.preventDefault();
    $("q").blur();
    everywhere = false;
    runSearch();
  };

  async function runSearch() {
    const q = $("q").value.trim();
    if (!q) return;
    lastQuery = q;
    $("scope").innerHTML = "";
    $("results").innerHTML = Array(5).fill('<div class="skeleton"></div>').join("");
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&everywhere=${everywhere}`);
      results = (await res.json()).results;
    } catch {
      results = [];
    }
    if (q !== lastQuery) return;
    renderResults();
  }

  function renderResults() {
    $("scope").innerHTML = everywhere
      ? `<span>Résultats YouTube (non vérifiés)</span><button id="back-curated">← Catalogue karaoké</button>`
      : `<span>Catalogue karaoké</span>`;
    if (everywhere) $("back-curated").onclick = () => { everywhere = false; runSearch(); };

    const rows = results.map((r, i) => `
      <div class="card song">
        <img src="${esc(r.thumbnail)}" alt="" loading="lazy">
        <div class="meta">
          <div class="t">${esc(r.title)}</div>
          ${r.artist ? `<div class="a ellipsis">${esc(r.artist)}</div>` : `<div class="a ellipsis">${esc(r.channel)}</div>`}
          <div class="tags">
            ${r.cancelled ? '<span class="tag tag-cancel">🚫 Cancel</span>' : ""}
            ${r.curated ? "" : '<span class="tag tag-yt">YouTube</span>'}
            ${r.cached ? '<span class="tag tag-ready">Prêt</span>' : ""}
            ${r.duration ? `<span class="tag">${fmt(r.duration)}</span>` : ""}
          </div>
        </div>
        <button class="add ${added.has(r.video_id) ? "done" : ""}" data-i="${i}" aria-label="Ajouter">${added.has(r.video_id) ? "✓" : "+"}</button>
      </div>`).join("");

    const empty = results.length ? "" : `
      <div class="placeholder"><div class="big">🤷</div>Rien trouvé${everywhere ? "" : " dans le catalogue karaoké"}.</div>`;
    const more = everywhere ? "" : `
      <div class="more">
        <p class="muted" style="margin:0 0 10px;font-size:.9rem">Pas la bonne chanson ?</p>
        <button class="btn btn-ghost" id="search-everywhere">Chercher sur tout YouTube</button>
      </div>`;
    $("results").innerHTML = rows + empty + more;

    $("results").querySelectorAll(".add").forEach((b) => b.onclick = () => addSong(results[+b.dataset.i], b));
    const ev = $("search-everywhere");
    if (ev) ev.onclick = async () => {
      const ok = await confirmSheet(
        "Chercher sur tout YouTube ?",
        "Ces vidéos ne viennent pas du catalogue karaoké : paroles absentes, voix pas retirée ou mauvaise qualité possibles.",
        "Chercher quand même",
      );
      if (ok) { everywhere = true; runSearch(); }
    };
  }

  async function addSong(r, btn) {
    if (!me) { askName(); return; }
    if (r.cancelled && !(await confirmSheet(
      "🚫 Artiste cancel",
      `${r.cancelled} Tu assumes de la chanter devant tout le monde ?`,
      "J'assume",
    ))) return;
    sock.send({ type: "add", video_id: r.video_id, title: r.title, artist: r.artist || r.channel, thumbnail: r.thumbnail, singer: me });
    added.add(r.video_id);
    btn.classList.add("done");
    btn.textContent = "✓";
    const pos = (room?.queue.length ?? 0) + (room?.current ? 1 : 0) + 1;
    toast(pos <= 1 ? "Ajouté — c'est bientôt à toi 🎤" : `Ajouté — position ${pos}`);
  }

  // --- render state -------------------------------------------------------
  function render() {
    if (!room) return;
    renderNow();
    if (!dragging) renderQueue();
    renderStage();
    const n = room.queue.length;
    $("badge").textContent = n;
    $("badge").classList.toggle("hidden", !n);
  }

  function renderNow() {
    const c = room.current;
    for (const id of ["now-mini", "now-mini-q"]) {
      const el = $(id);
      el.classList.toggle("hidden", !c);
      el.classList.toggle("paused", room.state === "paused");
      if (c) el.innerHTML = `
        <img src="${esc(c.thumbnail)}" alt="">
        <div class="meta">
          <div class="label"><span class="eq"><i></i><i></i><i></i></span>${room.state === "paused" ? "En pause" : "En cours"}</div>
          <div class="t ellipsis">${esc(c.title)}</div>
          <div class="muted ellipsis" style="font-size:.9rem">${esc(c.singer)}${c.artist ? " · " + esc(c.artist) : ""}</div>
        </div>`;
    }
  }

  function statusLine(i) {
    if (i.status === "ready") return '<span class="tag tag-ready">Prêt</span>';
    if (i.status === "error") return `<span class="tag tag-yt">Échec</span><button class="tag" data-retry="${i.id}">Réessayer</button>`;
    if (i.status === "downloading") return `<span class="spinner" style="width:.9em;height:.9em"></span> ${Math.round(i.progress * 100)}%`;
    return '<span class="spinner" style="width:.9em;height:.9em"></span> en attente';
  }

  function renderQueue() {
    const q = room.queue;
    $("qcount").textContent = q.length ? `${q.length} chanson${q.length > 1 ? "s" : ""}` : "";
    $("qhint").classList.toggle("hidden", q.length < 2);
    $("queue").innerHTML = q.length ? q.map((i, idx) => `
      <div class="card qi ${i.singer === me ? "mine" : ""}" data-id="${i.id}">
        <span class="handle">⠿</span>
        <span class="pos">${idx + 1}</span>
        <img src="${esc(i.thumbnail)}" alt="">
        <div class="meta">
          <div class="t ellipsis">${esc(i.title)}</div>
          <div class="sub"><span class="ellipsis">${esc(i.singer)}</span>${i.singer === me ? '<span class="tag tag-me">moi</span>' : ""}${i.cancelled ? '<span class="tag tag-cancel">🚫</span>' : ""} ${statusLine(i)}</div>
          ${i.status === "downloading" ? `<div class="bar"><i style="width:${Math.round(i.progress * 100)}%"></i></div>` : ""}
        </div>
        <button class="x" data-remove="${i.id}" aria-label="Retirer">✕</button>
      </div>`).join("")
      : `<div class="placeholder"><div class="big">🎶</div>La file est vide.<br><button class="btn btn-primary" style="margin-top:16px" onclick="show('search')">Choisir une chanson</button></div>`;

    $("queue").querySelectorAll("[data-remove]").forEach((b) => b.onclick = async () => {
      const item = q.find((i) => i.id === b.dataset.remove);
      if (item.singer !== me && !(await confirmSheet("Retirer cette chanson ?", `« ${item.title} » a été choisie par ${item.singer}.`, "Retirer"))) return;
      sock.send({ type: "remove", item_id: item.id });
    });
    $("queue").querySelectorAll("[data-retry]").forEach((b) => b.onclick = () => sock.send({ type: "retry", item_id: b.dataset.retry }));
  }

  Sortable.create($("queue"), {
    handle: ".handle",
    animation: 180,
    onStart: () => { dragging = true; },
    onEnd: (e) => {
      dragging = false;
      if (e.oldIndex !== e.newIndex) sock.send({ type: "move", item_id: e.item.dataset.id, index: e.newIndex });
      else render();
    },
  });

  function renderStage() {
    const c = room.current;
    if (!c) {
      $("stage").innerHTML = `<div class="placeholder"><div class="big">🎤</div>Rien ne joue pour l'instant.<br>
        ${room.queue.length ? "La prochaine chanson se prépare…" : "Ajoute une chanson pour lancer la soirée !"}</div>`;
      return;
    }
    const paused = room.state === "paused";
    $("stage").innerHTML = `
      <img class="art" src="${esc(c.thumbnail.replace("mqdefault", "hqdefault"))}" alt="">
      <div class="t">${esc(c.title)}</div>
      <div class="a">${esc(c.artist)}</div>
      <div class="singer"><span class="tag tag-me">🎤 ${esc(c.singer)}</span></div>
      <div class="controls">
        <button class="ctl" id="c-restart" aria-label="Recommencer">⟲</button>
        <button class="ctl main" id="c-play" aria-label="${paused ? "Lecture" : "Pause"}">${paused ? "▶" : "❚❚"}</button>
        <button class="ctl" id="c-skip" aria-label="Suivante">⏭</button>
      </div>
      <div class="vol"><span>🔈</span><input type="range" id="c-vol" min="0" max="1" step="0.05" value="${room.volume}"><span>🔊</span></div>
      <p class="muted stats">${room.sung} chanson${room.sung > 1 ? "s" : ""} chantée${room.sung > 1 ? "s" : ""} ce soir</p>`;
    $("c-play").onclick = () => sock.send({ type: paused ? "play" : "pause" });
    $("c-restart").onclick = () => sock.send({ type: "restart" });
    $("c-skip").onclick = async () => {
      if (await confirmSheet("Passer la chanson ?", `${c.singer} est en train de chanter « ${c.title} ».`, "Passer")) sock.send({ type: "skip" });
    };
    $("c-vol").onchange = (e) => sock.send({ type: "volume", value: +e.target.value });
  }
</script>
</body>
</html>
