name: xy - Test

on:
  push:
    paths:
      - "xy/**"
      - ".github/workflows/xy-test.yml"

defaults:
  run:
    working-directory: xy

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      XY_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - run: uv python install

      - run: uv sync --dev

      - name: Check formatting and linting
        run: make check-format

      - name: Type check
        run: make typecheck

      - name: Test with pytest
        run: make test
