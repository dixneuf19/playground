[project]
name = "vitry-auberge-bot"
version = "0.1.0"
description = "Telegram bot reminding the Vitry flatmates of their chores"
authors = [
    { name = "Julen Dixneuf", email = "julen@loudnaround.org" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "python-telegram-bot[job-queue]>=22.0",
]
readme = "README.md"
requires-python = "==3.14.*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8",
    "ty>=0.0.20",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ty.src]
include = ["vitry_auberge_bot"]
