[project]
name = "coco-lanta"
version = "0.1.0"
description = "Live TV for a Koh-Lanta themed party: phones are cameras, a control room picks what goes on the big screen"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pyjwt>=2.9",
    "segno>=1.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
coco-lanta = "coco_lanta.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "W", "SIM", "ARG", "PIE", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # command-line tools print

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
