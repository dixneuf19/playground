{% extends "base.html" %}
{% block title %} · réactions{% endblock %}
{% block body_class %}page react{% endblock %}
{% block body %}
<main class="card">
  <h1 class="brand small">Coco <span>☭</span> Lanta</h1>
  <p class="lead">Tape, ça s'affiche sur la télé.</p>
  <div class="emojis" id="emojis">
    {% for e in emoji %}<button type="button" data-emoji="{{ e }}">{{ e }}</button>{% endfor %}
  </div>
  <form id="comment">
    <input id="name" maxlength="24" autocomplete="off" placeholder="Ton nom">
    <div class="row">
      <input id="text" maxlength="80" autocomplete="off" placeholder="Un commentaire, camarade ?" required>
      <button class="btn btn-primary">Envoyer</button>
    </div>
  </form>
  <p class="links"><a href="/cam">📹 Devenir caméra</a></p>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ static('common.js') }}"></script>
<script src="{{ static('react.js') }}"></script>
{% endblock %}
